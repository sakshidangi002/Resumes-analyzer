name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # Listed inline, NOT `-r requirements.txt`.
        #
        # The repo has one requirements.txt on purpose - a developer installs
        # that and everything works. But it includes torch, opencv, insightface
        # and ultralytics, several GB that these unit tests never touch: the
        # tests that need the vision stack call pytest.importorskip and report
        # as SKIPPED (pytest runs with -rs below, so a skip is visible and never
        # silent).
        #
        # Inline rather than a second requirements file, because a second file
        # is exactly what drifted out of sync before - eight imports declared
        # nowhere, thirteen packages declared twice with different pins. This
        # list only has to be enough to IMPORT the pure-logic modules; if it
        # falls behind, the suite fails loudly here rather than quietly passing
        # a shrinking subset.
        run: |
          python -m pip install --upgrade pip
          pip install             pytest>=8.0 ruff>=0.5             pydantic>=2.0 pydantic-settings>=2.0 python-dotenv>=1.0             fastapi>=0.110 sqlalchemy>=2.0             bcrypt>=4.0,<5 cryptography>=42.0 "python-jose[cryptography]>=3.3"
      - name: Lint changed architecture seams
        run: ruff check backend/config.py backend/services tests
      - name: Run unit tests
        # -rs reports skipped tests. Without it a test that silently stops
        # running (missing dependency, bad import) looks identical to a passing
        # one, which is exactly how regressions slip back in.
        run: pytest -q -rs
